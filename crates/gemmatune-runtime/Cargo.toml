[package]
name = "gemmatune-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local Gemma 3 execution backed by Candle"

[features]
default = []
cuda = ["candle-core/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-transformers/metal", "dep:candle-metal-kernels"]

[dependencies]
candle-core = "=0.9.1"
candle-metal-kernels = { version = "=0.9.1", optional = true }
candle-nn = "=0.9.1"
candle-transformers = "=0.9.1"
gemmatune-core = { path = "../gemmatune-core" }
gemmatune-gemma = { path = "../gemmatune-gemma" }
gemmatune-lora = { path = "../gemmatune-lora" }
indexmap.workspace = true
unicode-segmentation.workspace = true
num_enum.workspace = true
proc-macro-crate.workspace = true
